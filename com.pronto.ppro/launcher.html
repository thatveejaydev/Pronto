<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRONTO Launcher</title><link rel="stylesheet" href="style.css"></head>
<body class="launcher">
<button id="open" class="open-search">Search project</button>
<fieldset class="shortcut-box"><legend>Shortcuts</legend>
<div class="shortcut-row"><label for="record-shortcut">Open PRONTO:</label><button id="record-shortcut" class="shortcut-value" title="Click to record. Right-click to disable.">disabled</button></div>
<div class="shortcut-row"><label for="record-preview-shortcut">Audio preview:</label><button id="record-preview-shortcut" class="shortcut-value" title="Click to record. Right-click to disable.">Ctrl+Space</button></div>
</fieldset>
<p id="shortcut-status" class="shortcut-status" role="status" aria-live="polite"></p>
<p id="preview-shortcut-status" class="shortcut-status" role="status" aria-live="polite"></p>
<p class="hint">Click a shortcut and press your keys. Esc cancels. Right-click to disable.</p>
<div hidden><input id="shortcut" value="Alt+Space"><button id="save-shortcut"></button><button id="disable-shortcut"></button></div>
<script src="shortcut.js"></script><script src="launcher.js"></script><script src="preview-settings.js"></script></body></html>
